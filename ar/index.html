<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AR Αχέροντας</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin:0; overflow:hidden;">

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;">

    <a-marker preset="hiro">

      <a-plane
        position="0 0.5 0"
        rotation="-90 0 0"
        width="2.5"
        height="1.2"
        color="#1565C0">
      </a-plane>

      <a-text
        value="Ποταμός Αχέροντας"
        color="white"
        align="center"
        position="0 0.8 0"
        scale="0.8 0.8 0.8">
      </a-text>

      <a-text
        value="Μυθικός ποταμός της Ηπείρου"
        color="white"
        align="center"
        position="0 0.55 0"
        scale="0.4 0.4 0.4">
      </a-text>

      <a-text
        value="Rafting - Kayak - Πεζοπορία"
        color="white"
        align="center"
        position="0 0.35 0"
        scale="0.35 0.35 0.35">
      </a-text>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
